name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,openai]"
      - run: python -m ruff check .
      - run: python -m compileall -q app
      - run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build container
        run: docker build --tag support-ai-evaluation-suite:ci .
      - name: Smoke-test container
        run: |
          docker run --detach --name support-ai-evaluation-suite-ci --publish 8000:8000 support-ai-evaluation-suite:ci
          for attempt in {1..15}; do
            curl --fail http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs support-ai-evaluation-suite-ci
          exit 1
