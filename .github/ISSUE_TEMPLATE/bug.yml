name: Bug report
description: Report a reproducible evaluation or regression-analysis defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Do not include API keys, customer conversations, or production traces.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
