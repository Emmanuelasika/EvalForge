[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evalforge"
version = "2.0.0"
description = "Persistent evaluation and regression-analysis workbench for AI support workflows."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Emmanuel Asika"}]
dependencies = ["fastapi==0.116.1", "uvicorn[standard]==0.35.0", "pydantic==2.11.7"]

[project.optional-dependencies]
openai = ["openai==1.99.9"]
dev = ["pytest==8.4.1", "httpx==0.28.1", "ruff==0.9.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
